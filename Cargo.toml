[package]
name = "iterative-solvers"
authors = ["Xiangong Tang <tangxiangong@gmail.com>"]
edition = "2024"
version = "0.2.1"
description = "Iterative algorithms for solving linear systems"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tangxiangong/iterative-solvers"
readme = "README.md"
categories = ["mathematics"]
keywords = ["numerical-algorithm", "math", "cg"]
exclude = ["julia-bench"]

# docs.rs 配置
[package.metadata.docs.rs]
features = ["nalgebra"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "iterative_solvers"
doctest = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[features]
default = ["nalgebra"]
nalgebra = ["dep:nalgebra", "dep:nalgebra-sparse"]
faer = ["dep:faer"]

[dependencies]
thiserror = "2.0.12"

# nalgebra backend, default
nalgebra = { version = "0.33", optional = true }
nalgebra-sparse = { version = "0.10.0", optional = true }

# faer backend
faer = { version = "0.22.6", optional = true }

[dev-dependencies]
criterion = "0.6.0"
nalgebra = "0.33"
nalgebra-sparse = "0.10"

[[bench]]
name = "diagm"
harness = false

[[bench]]
name = "cg"
harness = false

[package]
name = "iterative-solvers"
authors = ["Xiangong Tang <tangxiangong@gmail.com>"]
edition = "2024"
version = "0.2.3"
license = "MIT OR Apache-2.0"
description = "Iterative algorithms for solving linear systems"
repository = "https://github.com/tangxiangong/iterative-solvers"
readme = "README.md"
categories = ["mathematics"]
keywords = ["numerical-algorithm", "math", "cg"]
exclude = ["julia-bench"]

# docs.rs 配置
[package.metadata.docs.rs]
features = ["nalgebra"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "iterative_solvers"
doctest = false

[features]
default = ["nalgebra"]
faer = ["dep:faer"]
nalgebra = ["dep:nalgebra", "dep:nalgebra-sparse"]
ndarray = [
    "dep:ndarray",
    "dep:sprs",
    "dep:ndarray-linalg",
    "dep:blas-src",
    "dep:openblas-src",
]

[dependencies]
thiserror = "2"

# faer backend
faer = { version = "0.23", optional = true }

# nalgebra backend, default
nalgebra = { version = "0.34", optional = true }
nalgebra-sparse = { version = "0.11", optional = true }

# ndarray backend
blas-src = { version = "0.14", features = ["openblas"], optional = true }
ndarray = { version = "0.16", features = [
    "matrixmultiply-threading",
], optional = true }
ndarray-linalg = { version = "0.17", optional = true }
openblas-src = { version = "0.10", features = [
    "cblas",
    "system",
], optional = true }
sprs = { version = "0.11", optional = true }


[dev-dependencies]
criterion = "0.7.0"
faer = "0.23"
nalgebra = "0.34"
nalgebra-sparse = "0.11"
ndarray = "0.16"
sprs = "0.11"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[[bench]]
name = "diagm"
harness = false

[[bench]]
name = "cg"
harness = false
